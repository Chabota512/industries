openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: drive
    description: Owner-only Google Drive browsing, previews, and uploads
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /drive/access:
    get:
      operationId: getDriveAccess
      tags: [drive]
      summary: Check whether the signed-in user owns this app
      responses:
        "200":
          description: App ownership status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriveAccess"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /drive/claim:
    post:
      operationId: claimDriveAccess
      tags: [drive]
      summary: Claim app ownership if it has not already been claimed
      responses:
        "200":
          description: Ownership status after claim
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriveAccess"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Another signed-in user already claimed this app
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /drive/items:
    get:
      operationId: listDriveItems
      tags: [drive]
      summary: List folders and file metadata in one Google Drive folder
      parameters:
        - name: parentId
          in: query
          required: false
          schema:
            type: string
            maxLength: 200
        - name: pageToken
          in: query
          required: false
          schema:
            type: string
            maxLength: 2048
      responses:
        "200":
          description: One page of folder items; file contents are not returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriveItemsResponse"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: The signed-in account is not the owner or Drive denied access
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "400":
          description: Invalid folder or page token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: The selected folder could not be found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Google Drive request failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /drive/files/{fileId}/content:
    get:
      operationId: previewDriveFile
      tags: [drive]
      summary: Preview a file from Google Drive
      parameters:
        - name: fileId
          in: path
          required: true
          schema:
            type: string
            maxLength: 200
      responses:
        "200":
          description: The file or an export suitable for previewing
          content:
            application/octet-stream:
              schema:
                $ref: "#/components/schemas/DriveFileContent"
        "400":
          description: Invalid file ID or a folder was selected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: The signed-in account does not own this app
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: The file could not be found or opened
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "415":
          description: Google Drive cannot export this native file type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "413":
          description: The file is too large to preview in the app
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Google Drive request failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /drive/upload:
    post:
      operationId: uploadDriveFile
      tags: [drive]
      summary: Upload a new file into a Google Drive folder
      parameters:
        - name: parentId
          in: query
          required: false
          schema:
            type: string
            maxLength: 200
        - name: X-File-Name
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 720
        - name: X-File-Mime-Type
          in: header
          required: false
          schema:
            type: string
            maxLength: 120
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              $ref: "#/components/schemas/DriveFileContent"
      responses:
        "201":
          description: New Drive file created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriveItem"
        "400":
          description: Invalid folder or upload metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: The signed-in account is not the owner or Drive denied access
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "413":
          description: The file exceeds the upload limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Google Drive upload failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ApiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    DriveAccess:
      type: object
      properties:
        claimed:
          type: boolean
        isOwner:
          type: boolean
      required:
        - claimed
        - isOwner
    DriveItem:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        mimeType:
          type: string
        isFolder:
          type: boolean
        modifiedTime:
          type: ["string", "null"]
        webViewLink:
          type: ["string", "null"]
          format: uri
      required:
        - id
        - name
        - mimeType
        - isFolder
        - modifiedTime
        - webViewLink
    DriveItemsResponse:
      type: object
      properties:
        parentId:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/DriveItem"
        nextPageToken:
          type: ["string", "null"]
        incompleteSearch:
          type: boolean
      required:
        - parentId
        - items
        - nextPageToken
        - incompleteSearch
    DriveFileContent:
      type: string
      format: binary

